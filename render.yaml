services:
  - type: static_site
    name: farmhouse-frontend
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
    routes:
      # Old WordPress URL still indexed by Bing -> closest matching page
      - type: redirect
        source: /farmhouse-artisan-cheese-shares-the-art-of-the-charcuterie
        destination: /boards.html
      - type: redirect
        source: /farmhouse-artisan-cheese-shares-the-art-of-the-charcuterie/
        destination: /boards.html
